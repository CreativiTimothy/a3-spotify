@if (resources.length > 0) {
<div [id]="carouselId" class="carousel slide" data-bs-ride="false">
    <div class="carousel-inner">
        @for (resource of resources; track resource.id; let first = $first) {
            <div class="carousel-item" [class.active]="first">
                <app-carousel-card [resource]="resource"></app-carousel-card>
            </div>
        }
    </div>
    @if (resources.length > 1) {
        <button class="carousel-control-prev" type="button" [attr.data-bs-target]="carouselIdForBinding" data-bs-slide="prev" aria-label="Previous result">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        </button>
        <button class="carousel-control-next" type="button" [attr.data-bs-target]="carouselIdForBinding" data-bs-slide="next" aria-label="Next result">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
        </button>
    }
</div>
}
