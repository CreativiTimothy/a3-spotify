<div class="progress" role="progressbar" [attr.aria-label]="label" aria-valuemin="0" aria-valuemax="100" [attr.aria-valuenow]="popularity.percent * 100">
    <div class="progress-bar" [style.width.%]="popularity.percent * 100" [style.background-color]="popularity.color">
        <span>{{ label }}: {{ popularity.percentageString }}</span>
    </div>
</div>
