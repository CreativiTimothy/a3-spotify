<section aria-labelledby="searchHeading">
    <h1 id="searchHeading">Search Spotify</h1>
    <form (ngSubmit)="search()" class="search-controls">
        <label for="searchText" class="visually-hidden">Search text</label>
        <input id="searchText" class="form-control" name="searchText" [(ngModel)]="searchString" placeholder="Search Spotify" required>
        <label for="searchCategory" class="visually-hidden">Resource type</label>
        <select id="searchCategory" class="form-select" name="searchCategory" [(ngModel)]="searchCategory">
            @for (category of searchCategories; track category) { <option [value]="category">{{ category }}</option> }
        </select>
        <button class="btn btn-light" type="submit" [disabled]="loading">{{ loading ? 'Searching...' : 'Search' }}</button>
    </form>

    @if (errorMessage) { <p class="text-warning" role="alert">{{ errorMessage }}</p> }
    @if (!loading && resources.length === 0 && searchString.trim()) { <p>No results yet.</p> }
    @if (resources.length > 0 && searchCategory !== 'track') {
        <app-carousel carouselId="searchResults" [resources]="resources"></app-carousel>
    }
    @if (resources.length > 0 && searchCategory === 'track') {
        <app-track-list [tracks]="trackResults"></app-track-list>
    }
</section>
