<section aria-labelledby="aboutHeading">
    <h1 id="aboutHeading">About</h1>
    <button class="btn btn-light" type="button" (click)="loadAboutMe()" [disabled]="loading">
        {{ loading ? 'Loading...' : 'Load info about me' }}
    </button>

    @if (name) {
        <div class="profile-card">
            <img [src]="profile_pic" [alt]="name + ' Spotify profile image'">
            <h2>Logged in user: {{ name }}</h2>
            <a class="btn btn-outline-light" [href]="profile_link" target="_blank" rel="noopener noreferrer">
                Open profile on Spotify
            </a>
        </div>
    }
    @if (errorMessage) { <p class="text-warning" role="alert">{{ errorMessage }}</p> }
</section>
