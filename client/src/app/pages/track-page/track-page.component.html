@if (track) {
<div class="row g-4">
    <div class="col-md-6">
        <h1>{{ track.name }}</h1>
        @if (track.album) { <p>Track on <a [routerLink]="['/album', track.album.id]">{{ track.album.name }}</a></p> }
        <div>
            @for (artist of track.artists; track artist.id) { <p>Artist: <a [routerLink]="['/artist', artist.id]">{{ artist.name }}</a></p> }
        </div>
        <p>Duration: {{ track.durationStr }}</p>
        <a class="btn btn-light" [href]="track.url" target="_blank" rel="noopener noreferrer">Open {{ track.name }} on Spotify</a>
    </div>
    <div class="col-md-6">
        <app-thermometer label="Popularity" [popularity]="track.popularity"></app-thermometer>
        <app-spotify-player [spotifyUri]="track.uri"></app-spotify-player>
    </div>
</div>
}
@if (errorMessage) { <p class="alert alert-warning">{{ errorMessage }}</p> }
