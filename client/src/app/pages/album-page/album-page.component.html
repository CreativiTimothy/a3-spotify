@if (album) {
<div class="row g-4">
    <div class="col-md-5"><img id="albumImg" [src]="album.imageURL" [alt]="album.name"></div>
    <div class="col-md-7">
        <h1>{{ album.name }}</h1>
        <div>
            @for (artist of album.artists; track artist.id; let first = $first) {
                @if (!first) {, }<a [routerLink]="['/artist', artist.id]">{{ artist.name }}</a>
            }
        </div>
        <app-thermometer label="Popularity" [popularity]="album.popularity"></app-thermometer>
        <a class="btn btn-light" [href]="album.url" target="_blank" rel="noopener noreferrer">Open {{ album.name }} on Spotify</a>
    </div>
</div>
<section class="mt-4"><h2>Tracks</h2><app-track-list [tracks]="tracks" [hideArtist]="true" [hideAlbum]="true"></app-track-list></section>
}
@if (errorMessage) { <p class="alert alert-warning">{{ errorMessage }}</p> }
